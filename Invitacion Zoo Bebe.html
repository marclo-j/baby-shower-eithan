  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 2px 6px rgba(47,74,90,.06), 0 22px 44px -24px rgba(47,74,90,.35);display:flex;flex-direction:column;align-items:center\">\n          <div style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(24px,6vw,30px);line-height:1.2;color:#2F4A5A\">[Nombre del lugar]<\u002Fdiv>\n          <div style=\"margin-top:8px;font-size:16px;line-height:1.55;color:#4D6878\">[Dirección]<br>[Comuna / Ciudad]<\u002Fdiv>\n          <div style=\"margin:20px 0;width:60px;height:1px;background:#C9A961\"><\u002Fdiv>\n          <div style=\"font-family:'Cormorant Garamond',serif;font-weight:500;font-size:34px;line-height:1;color:#3D6F88\">16:00 hrs<\u002Fdiv>\n          <div style=\"margin-top:6px;font-size:14px;color:#4D6878\">Sábado 13 de diciembre<\u002Fdiv>\n          <div style=\"margin-top:24px;display:flex;flex-wrap:wrap;justify-content:center;gap:10px\">\n            <a href=\"{{ mapsHref }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:8px;min-height:50px;padding:13px 26px;border-radius:999px;background:#98C4D9;color:#2F4A5A;text-decoration:none;font-weight:800;font-size:15px;box-shadow:0 10px 22px -12px rgba(61,111,136,.7);transition:background .4s ease-out, color .4s ease-out, transform .4s ease-out\" style-hover=\"background:#3D6F88;color:#FFFDF8;transform:scale(1.03)\">Cómo llegar<\u002Fa>\n            <a href=\"{{ wazeHref }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;min-height:50px;padding:13px 20px;border-radius:999px;color:#3D6F88;text-decoration:none;font-weight:800;font-size:15px;transition:background .4s ease-out\" style-hover=\"background:#EAF4F8\">Abrir en Waze<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-reveal=\"\" data-reveal-delay=\"200\" style=\"margin-top:28px;width:150px;height:150px;border-radius:50%;background:#FFFDF8;box-shadow:0 0 0 8px rgba(255,253,248,.55);transform-origin:bottom center;animation:{{ swayAnim }}\">\n          <image-slot id=\"lugar-leon\" shape=\"circle\" placeholder=\"Leoncito bebé\" style=\"width:100%;height:100%\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <sc-if value=\"{{ showNotes }}\">\n          <div style=\"margin-top:24px;border:1.5px dashed #C9A961;background:#FBF4DF;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;text-align:left\"><b style=\"letter-spacing:.14em;font-size:11px\">ANIMACIÓN · LUGAR<\u002Fb><br>Fade-up con stagger. El leoncito se balancea ±3° (6 s, ease-in-out alterno). “Cómo llegar” abre Google Maps; enlace secundario a Waze.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"regalos\" data-screen-label=\"05 Regalos\" style=\"position:relative;background:#EAF4F8;padding:0 18px 100px\">\n      <div aria-hidden=\"true\" style=\"position:absolute;left:0;right:0;top:-39px;height:40px;pointer-events:none;background:radial-gradient(circle at 50% 100%, #EAF4F8 25px, transparent 26px) 0 100% / 50px 30px repeat-x, radial-gradient(circle at 50% 100%, #EAF4F8 36px, transparent 37px) 30px 100% / 88px 40px repeat-x\"><\u002Fdiv>\n      <div style=\"position:relative;max-width:1080px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center\">\n        <div style=\"display:flex;flex-direction:column;align-items:center;transform-origin:top center;animation:{{ swingAnim }}\">\n          <div style=\"position:relative;width:3px;height:64px;background:#A7C3A1;border-radius:2px\">\n            <div style=\"position:absolute;left:3px;top:14px;width:18px;height:9px;border-radius:50%;background:#A7C3A1;transform:rotate(-25deg)\"><\u002Fdiv>\n            <div style=\"position:absolute;right:3px;top:34px;width:16px;height:8px;border-radius:50%;background:#BCD3B6;transform:rotate(25deg)\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:110px;height:124px\">\n            <image-slot id=\"regalos-mono\" shape=\"rounded\" radius=\"55\" placeholder=\"Monito colgando con un regalo\" style=\"width:100%;height:100%\"><\u002Fimage-slot>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"margin-top:22px;display:flex;flex-direction:column;align-items:center\">\n          <div style=\"font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(28px,7vw,40px);letter-spacing:.2em;padding-left:.2em;color:#2F4A5A\">LISTA DE<\u002Fdiv>\n          <h2 style=\"margin:-8px 0 0;font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(60px,16vw,88px);line-height:1;color:#5E97B3\">regalos<\u002Fh2>\n        <\u002Fdiv>\n        <p data-reveal=\"\" style=\"margin:16px 0 0;max-width:520px;font-size:17px;line-height:1.6;color:#4D6878;text-wrap:pretty\">Tu presencia es nuestro mejor regalo, pero si quieres consentir a {{ baby }}, aquí tienes algunas ideas.<\u002Fp>\n        <p data-reveal=\"\" style=\"margin:10px 0 0;max-width:520px;font-size:14px;line-height:1.55;color:#4D6878\">Toca <b style=\"color:#2F4A5A\">“Lo regalo yo”<\u002Fb> y quedará reservado a tu nombre para que no se repita.<\u002Fp>\n        <div data-reveal=\"\" style=\"margin-top:26px;width:100%;max-width:420px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:#2F4A5A\"><span><b style=\"font-family:'Cormorant Garamond',serif;font-size:24px\">{{ reservedCount }}<\u002Fb> de {{ totalGifts }} regalos reservados<\u002Fspan><span style=\"font-weight:800;color:#3D6F88\">{{ pctLabel }}<\u002Fspan><\u002Fdiv>\n          <div style=\"margin-top:8px;height:10px;border-radius:999px;background:#C4DDE9;overflow:hidden\"><div style=\"height:100%;width:{{ pct }}%;border-radius:999px;background:#5E97B3;transition:width .9s cubic-bezier(.2,.7,.2,1)\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div role=\"tablist\" aria-label=\"Categorías\" style=\"margin:28px -18px 0;padding:4px 18px;display:flex;gap:8px;overflow-x:auto;max-width:calc(100% + 36px);scrollbar-width:none;justify-content:safe center\">\n          <sc-for list=\"{{ chips }}\" as=\"ch\" hint-placeholder-count=\"6\">\n            <button type=\"button\" role=\"tab\" aria-selected=\"{{ ch.active }}\" sc-camel-on-click=\"{{ ch.onClick }}\" style=\"flex:none;display:flex;align-items:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:999px;border:1.5px solid {{ ch.border }};background:{{ ch.bg }};color:#2F4A5A;font-weight:800;font-size:14px;white-space:nowrap;cursor:pointer;transition:background .35s ease-out, border-color .35s ease-out\">{{ ch.label }}<span style=\"font-size:12px;font-weight:700;color:#4D6878\">{{ ch.count }}<\u002Fspan><\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:22px;width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:20px;text-align:left\">\n          <sc-for list=\"{{ gifts }}\" as=\"g\" hint-placeholder-count=\"6\">\n            <article data-reveal=\"\" data-reveal-delay=\"{{ g.delay }}\" style=\"position:relative;background:#FFFDF8;border-radius:24px;overflow:hidden;box-shadow:0 2px 6px rgba(47,74,90,.06), 0 18px 40px -22px rgba(47,74,90,.32);display:flex;flex-direction:column;animation:{{ g.cardAnim }}\">\n              <div style=\"position:relative;aspect-ratio:4/3;background:#C4DDE9\">\n                <div style=\"position:absolute;inset:0;opacity:{{ g.dim }}\">\n                  <image-slot id=\"{{ g.slotId }}\" shape=\"rect\" placeholder=\"{{ g.placeholder }}\" style=\"width:100%;height:100%\"><\u002Fimage-slot>\n                <\u002Fdiv>\n                <span style=\"position:absolute;top:12px;left:12px;padding:5px 10px;border-radius:999px;background:rgba(255,253,248,.94);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#3D6F88;pointer-events:none\">{{ g.cat }}<\u002Fspan>\n                <sc-if value=\"{{ g.isReserved }}\">\n                  <div style=\"position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-8deg);padding:10px 18px;border-radius:14px;background:#F6E9C4;border:2px dashed #C9A961;box-shadow:0 10px 24px -12px rgba(47,74,90,.5);font-family:'Cormorant Garamond',serif;font-weight:600;font-size:21px;letter-spacing:.06em;color:#2F4A5A;white-space:nowrap;pointer-events:none;animation:{{ g.stampAnim }}\">Ya reservado ✓<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1\">\n                <div style=\"display:flex;flex-direction:column;gap:6px;flex:1;opacity:{{ g.dim }}\">\n                  <h3 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:23px;line-height:1.15;color:#2F4A5A\">{{ g.name }}<\u002Fh3>\n                  <p style=\"margin:0;font-size:14.5px;line-height:1.5;color:#4D6878\">{{ g.desc }}<\u002Fp>\n                  <div style=\"margin-top:4px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px\"><span style=\"font-weight:800;color:#2F4A5A\">Ref. {{ g.price }}<\u002Fspan><a href=\"{{ g.url }}\" target=\"_blank\" rel=\"noopener\" style=\"font-weight:700;color:#3D6F88\">Ver en tienda ↗<\u002Fa><\u002Fdiv>\n                <\u002Fdiv>\n                <sc-if value=\"{{ g.available }}\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ g.onReserve }}\" style=\"margin-top:8px;min-height:50px;border:none;border-radius:999px;background:#98C4D9;color:#2F4A5A;font-weight:800;font-size:15px;cursor:pointer;transition:background .4s ease-out, color .4s ease-out, transform .4s ease-out\" style-hover=\"background:#3D6F88;color:#FFFDF8;transform:scale(1.03)\" style-active=\"transform:scale(.98)\">Lo regalo yo 🎁<\u002Fbutton>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ g.isReserved }}\">\n                  <button type=\"button\" disabled=\"\" style=\"margin-top:8px;min-height:50px;border:1.5px solid #C4DDE9;border-radius:999px;background:#EAF4F8;color:#4D6878;font-weight:800;font-size:15px;cursor:not-allowed\">Reservado<\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Farticle>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"margin-top:40px;width:100%;max-width:640px;background:#FFFDF8;border-radius:28px;padding:30px clamp(20px,5vw,36px);box-shadow:0 2px 6px rgba(47,74,90,.06), 0 18px 40px -24px rgba(47,74,90,.3);text-align:center\">\n          <div style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(24px,6vw,30px);color:#2F4A5A\">¿Prefieres hacer un aporte?<\u002Fdiv>\n          <p style=\"margin:8px auto 0;max-width:440px;font-size:15px;line-height:1.55;color:#4D6878\">Si te resulta más cómodo, puedes transferir directamente. Lo usaremos para lo que {{ baby }} más necesite.<\u002Fp>\n          <div style=\"margin:20px auto 0;max-width:420px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;text-align:left;font-size:15px\">\n            <span style=\"color:#4D6878\">Titular<\u002Fspan><b style=\"color:#2F4A5A\">[Nombre del titular]<\u002Fb>\n            <span style=\"color:#4D6878\">RUT<\u002Fspan><b style=\"color:#2F4A5A\">[12.345.678-9]<\u002Fb>\n            <span style=\"color:#4D6878\">Banco<\u002Fspan><b style=\"color:#2F4A5A\">[Banco]<\u002Fb>\n            <span style=\"color:#4D6878\">Cuenta<\u002Fspan><b style=\"color:#2F4A5A\">[Tipo] · [N° de cuenta]<\u002Fb>\n            <span style=\"color:#4D6878\">Correo<\u002Fspan><b style=\"color:#2F4A5A;overflow-wrap:anywhere\">[correo@ejemplo.cl]<\u002Fb>\n          <\u002Fdiv>\n          <button type=\"button\" sc-camel-on-click=\"{{ copyBank }}\" style=\"margin-top:22px;min-height:46px;padding:11px 22px;border-radius:999px;border:1.5px solid #3D6F88;background:transparent;color:#3D6F88;font-weight:800;font-size:14px;cursor:pointer;transition:background .4s ease-out, color .4s ease-out, transform .4s ease-out\" style-hover=\"background:#3D6F88;color:#FFFDF8;transform:scale(1.03)\">{{ copyLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ showNotes }}\">\n          <div style=\"margin-top:24px;max-width:600px;border:1.5px dashed #C9A961;background:#FBF4DF;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;text-align:left\"><b style=\"letter-spacing:.14em;font-size:11px\">ANIMACIÓN · REGALOS<\u002Fb><br>Tarjetas con fade-up y stagger de 90 ms (también al cambiar de filtro). Al reservar: la tarjeta hace “pop” (1→1.045→1, 600 ms) y el sello “Ya reservado” cae con rebote (700 ms, overshoot). La barra de progreso crece 900 ms. El monito se columpia ±5° (4 s). Reservas guardadas localmente en esta maqueta; en Astro conectar a backend.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"dresscode\" data-screen-label=\"06 Dress code\" style=\"position:relative;background:#FFFDF8;padding:84px 20px 96px;text-align:center\">\n      <div aria-hidden=\"true\" style=\"position:absolute;left:0;right:0;top:-39px;height:40px;pointer-events:none;background:radial-gradient(circle at 50% 100%, #FFFDF8 25px, transparent 26px) 0 100% / 50px 30px repeat-x, radial-gradient(circle at 50% 100%, #FFFDF8 36px, transparent 37px) 50px 100% / 88px 40px repeat-x\"><\u002Fdiv>\n      <div style=\"position:relative;max-width:560px;margin:0 auto;display:flex;flex-direction:column;align-items:center\">\n        <div data-reveal=\"\" style=\"width:112px;height:112px;border-radius:50%;background:#EAF4F8\">\n          <image-slot id=\"dress-cebra\" shape=\"circle\" placeholder=\"Cebrita con moño\" style=\"width:100%;height:100%\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <h2 data-reveal=\"\" style=\"margin:20px 0 0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(28px,7vw,38px);letter-spacing:.22em;padding-left:.22em;color:#2F4A5A\">DRESS CODE<\u002Fh2>\n        <div data-reveal=\"\" style=\"margin-top:-2px;font-family:'Great Vibes',cursive;font-size:clamp(40px,10vw,52px);line-height:1.1;color:#5E97B3\">Tonos pastel<\u002Fdiv>\n        <p data-reveal=\"\" style=\"margin:10px 0 0;font-size:16px;line-height:1.6;color:#4D6878\">Te invitamos a vestir colores suaves: celestes, crema, beige y blanco.<\u002Fp>\n        <div style=\"margin-top:26px;display:flex;flex-wrap:wrap;justify-content:center;gap:16px\">\n          <div data-reveal=\"\" data-reveal-delay=\"0\" style=\"display:flex;flex-direction:column;align-items:center;gap:8px;width:64px\"><div style=\"width:52px;height:52px;border-radius:50%;background:#98C4D9;box-shadow:inset 0 0 0 1px rgba(47,74,90,.12)\"><\u002Fdiv><span style=\"font-size:12px;font-weight:700;color:#4D6878\">Celeste<\u002Fspan><\u002Fdiv>\n          <div data-reveal=\"\" data-reveal-delay=\"90\" style=\"display:flex;flex-direction:column;align-items:center;gap:8px;width:64px\"><div style=\"width:52px;height:52px;border-radius:50%;background:#C4DDE9;box-shadow:inset 0 0 0 1px rgba(47,74,90,.12)\"><\u002Fdiv><span style=\"font-size:12px;font-weight:700;color:#4D6878\">Cielo<\u002Fspan><\u002Fdiv>\n          <div data-reveal=\"\" data-reveal-delay=\"180\" style=\"display:flex;flex-direction:column;align-items:center;gap:8px;width:64px\"><div style=\"width:52px;height:52px;border-radius:50%;background:#F3EBDA;box-shadow:inset 0 0 0 1px rgba(47,74,90,.12)\"><\u002Fdiv><span style=\"font-size:12px;font-weight:700;color:#4D6878\">Crema<\u002Fspan><\u002Fdiv>\n          <div data-reveal=\"\" data-reveal-delay=\"270\" style=\"display:flex;flex-direction:column;align-items:center;gap:8px;width:64px\"><div style=\"width:52px;height:52px;border-radius:50%;background:#E3D3B8;box-shadow:inset 0 0 0 1px rgba(47,74,90,.12)\"><\u002Fdiv><span style=\"font-size:12px;font-weight:700;color:#4D6878\">Beige<\u002Fspan><\u002Fdiv>\n          <div data-reveal=\"\" data-reveal-delay=\"360\" style=\"display:flex;flex-direction:column;align-items:center;gap:8px;width:64px\"><div style=\"width:52px;height:52px;border-radius:50%;background:#FFFFFF;box-shadow:inset 0 0 0 1px rgba(47,74,90,.18)\"><\u002Fdiv><span style=\"font-size:12px;font-weight:700;color:#4D6878\">Blanco<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"confirmar\" data-screen-label=\"07 Confirmar\" style=\"position:relative;background:#98C4D9;padding:90px 18px 110px;text-align:center\">\n      <div aria-hidden=\"true\" style=\"position:absolute;left:0;right:0;top:-39px;height:40px;pointer-events:none;background:radial-gradient(circle at 50% 100%, #98C4D9 25px, transparent 26px) 0 100% / 50px 30px repeat-x, radial-gradient(circle at 50% 100%, #98C4D9 36px, transparent 37px) 20px 100% / 88px 40px repeat-x\"><\u002Fdiv>\n      <div aria-hidden=\"true\" style=\"position:absolute;inset:0;overflow:hidden;pointer-events:none\">{{ rsvpDeco }}<\u002Fdiv>\n      <div style=\"position:relative;max-width:560px;margin:0 auto;display:flex;flex-direction:column;align-items:center\">\n        <div data-reveal=\"\" style=\"width:120px;height:120px;border-radius:50%;background:#FFFDF8;box-shadow:0 0 0 8px rgba(255,253,248,.45)\">\n          <image-slot id=\"rsvp-hipo\" shape=\"circle\" placeholder=\"Hipopótamo bebé con un sobre\" style=\"width:100%;height:100%\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"margin-top:18px;display:flex;flex-direction:column;align-items:center\">\n          <h2 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(34px,9vw,48px);letter-spacing:.2em;padding-left:.2em;line-height:1;color:#2F4A5A\">CONFIRMAR<\u002Fh2>\n          <div style=\"margin-top:-2px;font-family:'Great Vibes',cursive;font-size:clamp(52px,13vw,70px);line-height:1.1;color:#2F4A5A\">Asistencia<\u002Fdiv>\n        <\u002Fdiv>\n        <p data-reveal=\"\" style=\"margin:8px 0 0;max-width:440px;font-size:17px;line-height:1.6;color:#2F4A5A;text-wrap:pretty\">Nos encantará saber que nos acompañarás. Por favor confirma antes del <b>30 de noviembre<\u002Fb>.<\u002Fp>\n\n        <div data-reveal=\"\" style=\"margin-top:28px;width:100%;background:#FFFDF8;border-radius:28px;padding:clamp(22px,6vw,36px);box-shadow:0 2px 6px rgba(47,74,90,.08), 0 30px 60px -28px rgba(47,74,90,.5);text-align:left\">\n          <sc-if value=\"{{ formVisible }}\" hint-placeholder-val=\"{{ true }}\">\n            <form sc-camel-on-submit=\"{{ submitRsvp }}\" sc-camel-no-validate=\"{{ true }}\" style=\"display:flex;flex-direction:column;gap:20px\">\n              <label style=\"display:flex;flex-direction:column;gap:8px\">\n                <span style=\"font-size:14px;font-weight:800;color:#2F4A5A\">Nombre completo <span style=\"color:#B5566A\">*<\u002Fspan><\u002Fspan>\n                <input type=\"text\" autocomplete=\"name\" placeholder=\"Ej: Antonia Pérez\" value=\"{{ r.name }}\" sc-camel-on-change=\"{{ onName }}\" aria-invalid=\"{{ nameInvalid }}\" style=\"height:52px;padding:0 16px;border-radius:14px;border:1.5px solid;border-color:{{ nameBorder }};background:#F7FBFD;font-size:16px;outline:none;transition:box-shadow .2s ease-out, background .2s ease-out\" style-focus=\"box-shadow:0 0 0 4px rgba(152,196,217,.55);background:#FFFFFF\">\n                <sc-if value=\"{{ errName }}\"><span role=\"alert\" style=\"display:flex;gap:8px;align-items:center;font-size:13.5px;font-weight:600;color:#B5566A\"><span aria-hidden=\"true\" style=\"flex:none;width:18px;height:18px;border-radius:50%;background:#B5566A;color:#FFFDF8;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center\">!<\u002Fspan>{{ errName }}<\u002Fspan><\u002Fsc-if>\n              <\u002Flabel>\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <span style=\"font-size:14px;font-weight:800;color:#2F4A5A\">¿Asistirás? <span style=\"color:#B5566A\">*<\u002Fspan><\u002Fspan>\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px\">\n                  <button type=\"button\" aria-pressed=\"{{ isYes }}\" sc-camel-on-click=\"{{ pickYes }}\" style=\"min-height:58px;padding:12px;border-radius:18px;border:2px solid {{ yesBorder }};background:{{ yesBg }};color:#2F4A5A;font-weight:800;font-size:15px;cursor:pointer;transition:background .35s ease-out, border-color .35s ease-out, transform .35s ease-out\" style-hover=\"transform:scale(1.02)\">¡Sí, ahí estaré! 🎉<\u002Fbutton>\n                  <button type=\"button\" aria-pressed=\"{{ isNo }}\" sc-camel-on-click=\"{{ pickNo }}\" style=\"min-height:58px;padding:12px;border-radius:18px;border:2px solid {{ noBorder }};background:{{ noBg }};color:#2F4A5A;font-weight:800;font-size:15px;cursor:pointer;transition:background .35s ease-out, border-color .35s ease-out, transform .35s ease-out\" style-hover=\"transform:scale(1.02)\">No podré asistir 😢<\u002Fbutton>\n                <\u002Fdiv>\n                <sc-if value=\"{{ errAttend }}\"><span role=\"alert\" style=\"display:flex;gap:8px;align-items:center;font-size:13.5px;font-weight:600;color:#B5566A\"><span aria-hidden=\"true\" style=\"flex:none;width:18px;height:18px;border-radius:50%;background:#B5566A;color:#FFFDF8;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center\">!<\u002Fspan>{{ errAttend }}<\u002Fspan><\u002Fsc-if>\n              <\u002Fdiv>\n              <sc-if value=\"{{ isYes }}\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:18px;background:#EAF4F8;animation:fadeUp .5s ease-out\">\n                  <div style=\"display:flex;flex-direction:column\"><span style=\"font-size:14px;font-weight:800;color:#2F4A5A\">Acompañantes<\u002Fspan><span style=\"font-size:13px;color:#4D6878\">Sin contarte a ti<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:6px\">\n                    <button type=\"button\" aria-label=\"Quitar acompañante\" sc-camel-on-click=\"{{ guestMinus }}\" disabled=\"{{ minusDisabled }}\" style=\"width:44px;height:44px;border-radius:50%;border:1.5px solid #98C4D9;background:#FFFDF8;font-size:22px;font-weight:700;line-height:1;cursor:pointer;opacity:{{ minusOpacity }}\">−<\u002Fbutton>\n                    <span aria-live=\"polite\" style=\"width:40px;text-align:center;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px;color:#2F4A5A\">{{ r.guests }}<\u002Fspan>\n                    <button type=\"button\" aria-label=\"Agregar acompañante\" sc-camel-on-click=\"{{ guestPlus }}\" disabled=\"{{ plusDisabled }}\" style=\"width:44px;height:44px;border-radius:50%;border:none;background:#98C4D9;font-size:22px;font-weight:700;line-height:1;cursor:pointer;opacity:{{ plusOpacity }}\">+<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <label style=\"display:flex;flex-direction:column;gap:8px\">\n                <span style=\"font-size:14px;font-weight:800;color:#2F4A5A\">Teléfono o WhatsApp <span style=\"font-weight:600;color:#4D6878\">(opcional)<\u002Fspan><\u002Fspan>\n                <input type=\"tel\" autocomplete=\"tel\" placeholder=\"+56 9 1234 5678\" value=\"{{ r.phone }}\" sc-camel-on-change=\"{{ onPhone }}\" style=\"height:52px;padding:0 16px;border-radius:14px;border:1.5px solid;border-color:{{ phoneBorder }};background:#F7FBFD;font-size:16px;outline:none;transition:box-shadow .2s ease-out, background .2s ease-out\" style-focus=\"box-shadow:0 0 0 4px rgba(152,196,217,.55);background:#FFFFFF\">\n                <sc-if value=\"{{ errPhone }}\"><span role=\"alert\" style=\"display:flex;gap:8px;align-items:center;font-size:13.5px;font-weight:600;color:#B5566A\"><span aria-hidden=\"true\" style=\"flex:none;width:18px;height:18px;border-radius:50%;background:#B5566A;color:#FFFDF8;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center\">!<\u002Fspan>{{ errPhone }}<\u002Fspan><\u002Fsc-if>\n              <\u002Flabel>\n              <sc-if value=\"{{ isYes }}\">\n                <label style=\"display:flex;flex-direction:column;gap:8px\">\n                  <span style=\"font-size:14px;font-weight:800;color:#2F4A5A\">Restricciones alimentarias <span style=\"font-weight:600;color:#4D6878\">(opcional)<\u002Fspan><\u002Fspan>\n                  <input type=\"text\" placeholder=\"Vegetariano, sin gluten, alergias…\" value=\"{{ r.diet }}\" sc-camel-on-change=\"{{ onDiet }}\" style=\"height:52px;padding:0 16px;border-radius:14px;border:1.5px solid #C4DDE9;background:#F7FBFD;font-size:16px;outline:none;transition:box-shadow .2s ease-out, background .2s ease-out\" style-focus=\"box-shadow:0 0 0 4px rgba(152,196,217,.55);background:#FFFFFF;border-color:#5E97B3\">\n                <\u002Flabel>\n              <\u002Fsc-if>\n              <label style=\"display:flex;flex-direction:column;gap:8px\">\n                <span style=\"font-size:14px;font-weight:800;color:#2F4A5A\">Mensaje para {{ baby }} <span style=\"font-weight:600;color:#4D6878\">(opcional)<\u002Fspan><\u002Fspan>\n                <textarea rows=\"3\" placeholder=\"Unas palabras o buenos deseos…\" value=\"{{ r.msg }}\" sc-camel-on-change=\"{{ onMsg }}\" style=\"padding:14px 16px;border-radius:14px;border:1.5px solid #C4DDE9;background:#F7FBFD;font-size:16px;line-height:1.5;resize:vertical;outline:none;transition:box-shadow .2s ease-out, background .2s ease-out\" style-focus=\"box-shadow:0 0 0 4px rgba(152,196,217,.55);background:#FFFFFF;border-color:#5E97B3\"><\u002Ftextarea>\n              <\u002Flabel>\n              <button type=\"submit\" disabled=\"{{ loading }}\" style=\"min-height:56px;border:none;border-radius:999px;background:{{ submitBg }};color:{{ submitColor }};font-weight:800;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 12px 24px -14px rgba(61,111,136,.8);transition:background .4s ease-out, color .4s ease-out, transform .4s ease-out\" style-hover=\"background:#3D6F88;color:#FFFDF8;transform:scale(1.03)\">{{ submitContent }}<\u002Fbutton>\n              <p style=\"margin:-6px 0 0;text-align:center;font-size:13px;color:#4D6878\">Si cambian tus planes, puedes volver a confirmar.<\u002Fp>\n            <\u002Fform>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ done }}\">\n            <div style=\"display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0 4px;animation:fadeUp .6s ease-out\">\n              <div style=\"width:150px;height:150px;border-radius:50%;background:#EAF4F8;animation:jump 1.2s ease-out .2s 2\">\n                <image-slot id=\"rsvp-exito\" shape=\"circle\" placeholder=\"Hipopótamo celebrando\" style=\"width:100%;height:100%\"><\u002Fimage-slot>\n              <\u002Fdiv>\n              <div style=\"margin-top:20px;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(28px,7vw,36px);line-height:1.15;color:#2F4A5A\">¡Gracias por confirmar!<\u002Fdiv>\n              <p style=\"margin:10px 0 0;max-width:380px;font-size:16px;line-height:1.6;color:#4D6878\">{{ doneMsg }}<\u002Fp>\n              <button type=\"button\" sc-camel-on-click=\"{{ editRsvp }}\" style=\"margin-top:20px;min-height:44px;padding:10px 18px;border:none;background:transparent;color:#3D6F88;font-weight:800;font-size:14px;text-decoration:underline;cursor:pointer\">Editar mi respuesta<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <sc-if value=\"{{ showNotes }}\">\n          <div style=\"margin-top:24px;border:1.5px dashed #C9A961;background:#FBF4DF;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;text-align:left\"><b style=\"letter-spacing:.14em;font-size:11px\">ANIMACIÓN · RSVP<\u002Fb><br>Foco: anillo celeste 4 px (200 ms). Acompañantes y restricciones aparecen con fade-up solo si asiste. Enviar → spinner (“Enviando…”), luego lluvia de confeti de estrellitas (2.6–4.2 s) y el hipopótamo salta 2 veces.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <footer data-screen-label=\"08 Cierre\" style=\"position:relative;background:#FFFDF8;padding:80px 20px 130px;text-align:center\">\n      <div aria-hidden=\"true\" style=\"position:absolute;left:0;right:0;top:-39px;height:40px;pointer-events:none;background:radial-gradient(circle at 50% 100%, #FFFDF8 25px, transparent 26px) 0 100% / 50px 30px repeat-x, radial-gradient(circle at 50% 100%, #FFFDF8 36px, transparent 37px) 60px 100% / 88px 40px repeat-x\"><\u002Fdiv>\n      <div aria-hidden=\"true\" style=\"position:absolute;inset:0;overflow:hidden;pointer-events:none\">{{ footerDeco }}<\u002Fdiv>\n      <div style=\"position:relative;max-width:680px;margin:0 auto;display:flex;flex-direction:column;align-items:center\">\n        <h2 data-reveal=\"\" style=\"margin:0;font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(66px,17vw,112px);line-height:1.1;color:#5E97B3\">Te esperamos<\u002Fh2>\n        <div data-reveal=\"\" style=\"margin-top:18px;width:100%;max-width:620px;aspect-ratio:16/10;border-radius:28px;background:#EAF4F8\">\n          <image-slot id=\"cierre-animalitos\" shape=\"rounded\" radius=\"28\" placeholder=\"Ilustración final: elefante, jirafa, león y cebra juntos sobre nubes\" style=\"width:100%;height:100%\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <div style=\"margin-top:30px;width:100%;max-width:420px\">{{ footerBunting }}<\u002Fdiv>\n        <p data-reveal=\"\" style=\"margin:10px 0 0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;color:#4D6878\">Con cariño,<\u002Fp>\n        <p data-reveal=\"\" style=\"margin:0;font-family:'Great Vibes',cursive;font-size:clamp(42px,10vw,56px);line-height:1.15;color:#3D6F88\">{{ parents }}<\u002Fp>\n        <p style=\"margin:28px 0 0;font-size:13px;font-weight:700;letter-spacing:.06em;color:#4D6878\">Hecho con 💙 para {{ baby }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Ffooter>\n  <\u002Fmain>\n\n  <sc-if value=\"{{ showNav }}\">\n    <nav aria-label=\"Accesos rápidos\" style=\"position:fixed;left:50%;bottom:max(14px, env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:flex;gap:4px;padding:5px;background:rgba(255,253,248,.94);backdrop-filter:blur(10px);border-radius:999px;border:1px solid rgba(152,196,217,.6);box-shadow:0 16px 34px -16px rgba(47,74,90,.55)\">\n      <a href=\"#inicio\" style=\"display:flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;text-decoration:none;color:#2F4A5A;font-weight:800;font-size:14px;transition:background .3s ease-out\" style-hover=\"background:#EAF4F8;color:#2F4A5A\">Inicio<\u002Fa>\n      <a href=\"#regalos\" style=\"display:flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;text-decoration:none;color:#2F4A5A;font-weight:800;font-size:14px;transition:background .3s ease-out\" style-hover=\"background:#EAF4F8;color:#2F4A5A\">Regalos<\u002Fa>\n      <a href=\"#confirmar\" style=\"display:flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;text-decoration:none;background:#98C4D9;color:#2F4A5A;font-weight:800;font-size:14px;transition:background .3s ease-out, color .3s ease-out\" style-hover=\"background:#3D6F88;color:#FFFDF8\">Confirmar<\u002Fa>\n    <\u002Fnav>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ modalOpen }}\">\n    <div sc-camel-on-click=\"{{ closeModal }}\" style=\"position:fixed;inset:0;z-index:120;background:rgba(47,74,90,.45);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px\">\n      <div role=\"dialog\" aria-modal=\"true\" aria-label=\"Reservar regalo\" sc-camel-on-click=\"{{ stop }}\" style=\"position:relative;width:100%;max-width:400px;background:#FFFDF8;border-radius:28px;padding:30px 24px 24px;box-shadow:0 30px 70px -20px rgba(47,74,90,.6);animation:modalIn .45s cubic-bezier(.2,.7,.2,1);text-align:center\">\n        <button type=\"button\" aria-label=\"Cerrar\" sc-camel-on-click=\"{{ closeModal }}\" style=\"position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:none;background:transparent;font-size:22px;color:#4D6878;cursor:pointer\" style-hover=\"background:#EAF4F8\">×<\u002Fbutton>\n        <sc-if value=\"{{ modalForm }}\">\n          <div style=\"display:flex;flex-direction:column;align-items:center\">\n            <div style=\"font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#3D6F88\">Reservar regalo<\u002Fdiv>\n            <div style=\"margin-top:8px;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:28px;line-height:1.15;color:#2F4A5A\">{{ modalGiftName }}<\u002Fdiv>\n            <p style=\"margin:10px 0 0;font-size:15px;line-height:1.55;color:#4D6878\">Déjanos tu nombre y lo marcaremos como reservado para que nadie más lo repita.<\u002Fp>\n            <label style=\"margin-top:18px;width:100%;display:flex;flex-direction:column;gap:8px;text-align:left\">\n              <span style=\"font-size:14px;font-weight:800;color:#2F4A5A\">Tu nombre<\u002Fspan>\n              <input type=\"text\" sc-camel-auto-focus=\"{{ true }}\" placeholder=\"Ej: Tía Paula\" value=\"{{ modalName }}\" sc-camel-on-change=\"{{ onModalName }}\" sc-camel-on-key-down=\"{{ onModalKey }}\" style=\"height:52px;padding:0 16px;border-radius:14px;border:1.5px solid;border-color:{{ modalBorder }};background:#F7FBFD;font-size:16px;outline:none\" style-focus=\"box-shadow:0 0 0 4px rgba(152,196,217,.55);background:#FFFFFF\">\n              <sc-if value=\"{{ modalErr }}\"><span role=\"alert\" style=\"font-size:13.5px;font-weight:600;color:#B5566A\">{{ modalErr }}<\u002Fspan><\u002Fsc-if>\n            <\u002Flabel>\n            <button type=\"button\" sc-camel-on-click=\"{{ confirmReserve }}\" style=\"margin-top:18px;width:100%;min-height:52px;border:none;border-radius:999px;background:#98C4D9;color:#2F4A5A;font-weight:800;font-size:15px;cursor:pointer;transition:background .4s ease-out, color .4s ease-out, transform .4s ease-out\" style-hover=\"background:#3D6F88;color:#FFFDF8;transform:scale(1.03)\">Confirmar reserva<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ closeModal }}\" style=\"margin-top:6px;width:100%;min-height:46px;border:none;background:transparent;color:#3D6F88;font-weight:800;font-size:14px;cursor:pointer\">Cancelar<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ modalDone }}\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;padding:6px 0 4px;animation:fadeUp .5s ease-out\">\n            <div style=\"font-family:'Cormorant Garamond',serif;font-size:26px;letter-spacing:.3em;color:#C9A961\">✦ ✦ ✦<\u002Fdiv>\n            <div style=\"margin-top:10px;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px;line-height:1.15;color:#2F4A5A\">¡Gracias, {{ modalFirst }}!<\u002Fdiv>\n            <p style=\"margin:8px 0 0;font-size:17px;line-height:1.55;color:#2F4A5A\">{{ baby }} te lo agradecerá 💙<\u002Fp>\n            <p style=\"margin:8px 0 0;font-size:14px;line-height:1.55;color:#4D6878\">“{{ modalGiftName }}” quedó reservado a tu nombre.<\u002Fp>\n            <button type=\"button\" sc-camel-on-click=\"{{ closeModal }}\" style=\"margin-top:20px;width:100%;min-height:52px;border:none;border-radius:999px;background:#98C4D9;color:#2F4A5A;font-weight:800;font-size:15px;cursor:pointer;transition:background .4s ease-out, color .4s ease-out\" style-hover=\"background:#3D6F88;color:#FFFDF8\">Volver a la lista<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  {{ confetti }}\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;babyName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Benjamín&quot;,&quot;tsType&quot;:&quot;string&quot;
